<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | SOUR Ultimate</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&family=Permanent+Marker&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bg-particles"><span style="--i:1;">⭐</span><span style="--i:3;">💜</span><span style="--i:6;">⭐</span></div>

    <header>
        <nav class="navbar">
            <div class="logo neon-text">💜 SOUR.VIBE</div>
            <ul class="nav-links">
                <li><a href="index.html">หน้าแรก</a></li>
                <li><a href="profile.html">ประวัติส่วนตัว</a></li>
                <li><a href="education.html">การศึกษา</a></li>
                <li><a href="hobby.html">งานอดิเรก</a></li>
                <li><a href="contact.html" class="active">ติดต่อ</a></li>
            </ul>
        </nav>
    </header>

    <main class="page-container">
        <h1 class="page-title sour-text super-glow">Say Hello! 👋</h1>
        
        <section class="contact-section">
            <div class="contact-intro glass-box float-anim">
                <h2 class="neon-text-light">อย่ารอช้า ทักมาเลย!</h2>
                <p>ยินดีที่ได้รู้จักทุกคนครับ/ค่ะ 💜</p>
            </div>

            <div class="contact-grid">
                <div class="contact-card premium-glass hover-3d box-glow">
                    <div class="icon float-icon">📧</div>
                    <h3 class="highlight-neon">Email</h3>
                    <p class="contact-detail">[กรอกอีเมลของคุณ@gmail.com]</p>
                    <a href="mailto:[อีเมล]" class="btn btn-outline pulse-btn">ส่งอีเมล 💌</a>
                </div>

                <div class="contact-card premium-glass hover-3d box-glow">
                    <div class="icon float-icon">📱</div>
                    <h3 class="highlight-neon">Social Media</h3>
                    <p class="contact-detail">FB: [กรอกชื่อ FB]<br>IG: [กรอกชื่อ IG]</p>
                    <a href="#" class="btn btn-primary pulse-btn">ฟอลโลว์ฉันเลย ✨</a>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
